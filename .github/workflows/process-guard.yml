name: Process Guard – TDD & Compliance Check (P-02/P-03/P-04/P-06/P-07/P-08/P-09/P-10/P-12/P-13/P-19)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - development
      - main

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  process-guard:
    name: Prozess-Guard Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: P-19 – Kein automatisches Issue-Schliessen im PR-Body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BODY_FILE=$(mktemp)
          printf '%s' "$PR_BODY" > "$BODY_FILE"
          bash scripts/process_guard/check_pr_body_no_autoclose.sh "$BODY_FILE"

      - name: P-10 – Review-Agent-Nachweis vorhanden (SHA-gebunden, TARA-0107)
        if: |
          !(github.head_ref == 'development' && github.base_ref == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          COMMENTS_FILE=$(mktemp)
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | {body, created_at}]' > "$COMMENTS_FILE" || echo '[]' > "$COMMENTS_FILE"
          bash scripts/process_guard/check_review_agent_invoked.sh "$COMMENTS_FILE" "$PR_HEAD_SHA"

      - name: P-25 – PO-Akzeptanz-Gate vor Merge (Statusmodell B, TARA-0110)
        if: |
          !(github.head_ref == 'development' && github.base_ref == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          BRANCH="${{ github.head_ref }}"
          if ! RESOLVED=$(bash scripts/process_guard/resolve_tara_testfile.sh "$BRANCH"); then
            echo "INFO P-25: Kein TARA-ID im Branch-Namen - PO-Akzeptanz-Gate uebersprungen"
            exit 0
          fi
          eval "$RESOLVED"

          RAW_COMMENTS_FILE=$(mktemp)
          gh api "repos/${{ github.repository }}/issues/${PR_NUMBER}/comments" \
            --jq '[.[] | {body, created_at, author: .user.login}]' > "$RAW_COMMENTS_FILE" || echo '[]' > "$RAW_COMMENTS_FILE"

          # Kommentare mit Berechtigungs-Flag anreichern: nur Kommentare von
          # Nutzern mit write/maintain/admin-Rechten duerfen als gebundene
          # PO-Akzeptanz zaehlen (siehe annotate_comment_permissions.py).
          COMMENTS_FILE=$(mktemp)
          python3 scripts/process_guard/annotate_comment_permissions.py \
            "$RAW_COMMENTS_FILE" "$COMMENTS_FILE" "${{ github.repository }}"

          # Referenz-Zeitstempel "letzter Push": Committer-Datum des aktuellen
          # Head-Commits (dieselbe, bereits fuer P-02/P-09 akzeptierte
          # Datenquelle samt dokumentiertem Restrisiko, siehe Folge-Issue #193).
          HEAD_PUSHED_AT=$(git log -1 --format=%cI "$PR_HEAD_SHA")

          bash scripts/process_guard/check_po_acceptance_gate.sh "$COMMENTS_FILE" "$TARA_ID" "$PR_HEAD_SHA" "$HEAD_PUSHED_AT"

      - name: P-07 – Branch-Name Schema
        run: |
          BRANCH="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "Branch: $BRANCH -> $BASE"
          # Release-PRs: development -> main sind erlaubt (kein Feature-Branch noetig)
          if [ "$BRANCH" = "development" ] && [ "$BASE" = "main" ]; then
            echo "OK P-07: Release-PR development -> main ist erlaubt"
          elif echo "$BRANCH" | grep -qE '^(feature/TARA-[0-9]{4}-|hotfix/TARA-[0-9]{4}-|chore/)'; then
            echo "OK P-07: Branch-Name korrekt"
          else
            echo "FAIL P-07: Branch-Name '$BRANCH' entspricht nicht 'feature/TARA-XXXX-*'"
            exit 1
          fi

      - name: P-08 – TARA-ID in Commit-Messages
        run: |
          BRANCH="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"
          # Release-PRs muessen nicht jeden Commit mit TARA-ID kennzeichnen
          if [ "$BRANCH" = "development" ] && [ "$BASE_REF" = "main" ]; then
            echo "OK P-08: Release-PR development -> main – Commit-Check uebersprungen"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          while IFS= read -r line; do
            if ! echo "$line" | grep -qE 'TARA-[0-9]{4}|chore:|docs:|fix:|hotfix:'; then
              echo "FAIL P-08: Commit ohne TARA-ID: $line"
              MISSING=1
            fi
          done < <(git log --oneline "$BASE..$HEAD")
          if [ "$MISSING" -eq 0 ]; then
            echo "OK P-08: Alle Commits referenzieren TARA-ID"
          else
            exit 1
          fi

      - name: P-02/P-09 – Audit-Trail-Zeitstempel deterministisch pruefen (TARA-0108)
        id: board_status
        if: |
          !(github.head_ref == 'development' && github.base_ref == 'main')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_CREATED_AT: ${{ github.event.pull_request.created_at }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # TARA-0108: Ersetzt die bisherige "Status != Todo"-Heuristik durch
          # einen deterministischen Vergleich zweier unveraenderlicher GitHub-
          # Zeitstempel (Audit-Trail-Kommentar auf dem Story-Issue vs. erstes
          # Commit-Datum bzw. PR-Erstellungsdatum) - kein Agent entscheidet
          # mehr selbst, ob P-02/P-09 eingehalten wurden.
          BODY_FILE=$(mktemp)
          printf '%s' "$PR_BODY" > "$BODY_FILE"
          ISSUE_NUMBER=$(BODY_FILE="$BODY_FILE" python3 -c "import sys, os; sys.path.insert(0, 'scripts/process_guard'); from status_timing_check import extract_issue_number; body = open(os.environ['BODY_FILE'], encoding='utf-8').read(); n = extract_issue_number(body); print(n if n is not None else '')")
          if [ -z "$ISSUE_NUMBER" ]; then
            echo "INFO P-02/P-09: Kein 'Bezug: #NNN' im PR-Body gefunden - Check uebersprungen"
            exit 0
          fi

          COMMENTS_FILE=$(mktemp)
          gh api "repos/${{ github.repository }}/issues/${ISSUE_NUMBER}/comments" \
            --jq '[.[] | {body, created_at}]' > "$COMMENTS_FILE" || echo '[]' > "$COMMENTS_FILE"

          # Hinweis (Review-Finding PR #192, siehe #193): Sowohl Autor- als
          # auch Committer-Datum eines Commits sind vom Ersteller lokal frei
          # waehlbar (z.B. `git commit --date=...` bzw. GIT_COMMITTER_DATE)
          # und damit theoretisch faelschbar. Wir verwenden hier bewusst das
          # Committer-Datum (%cI) statt des Autor-Datums (%aI), da es bei
          # jedem Amend/Rebase automatisch aktualisiert wird und ein
          # gezieltes Faelschen dadurch schwerer unbemerkt bleibt - das
          # ersetzt aber keinen serverseitigen, nicht faelschbaren Zeitstempel.
          # Verfolgt als Folge-Issue #193 (haertere, server-seitige Quelle,
          # z.B. Workflow-Run-Zeitstempel des ersten Pushs).
          FIRST_COMMIT_ISO=$(git log --reverse --format=%cI "$BASE_SHA..$HEAD_SHA" | head -n1)
          if [ -z "$FIRST_COMMIT_ISO" ]; then
            echo "INFO P-02: Kein Commit im PR-Bereich gefunden - P-02-Zeitpruefung uebersprungen"
          else
            bash scripts/process_guard/check_status_transition_timing.sh "$COMMENTS_FILE" "In Progress" "$FIRST_COMMIT_ISO" "P-02"
          fi

          bash scripts/process_guard/check_status_transition_timing.sh "$COMMENTS_FILE" "inReview" "$PR_CREATED_AT" "P-09"

      - name: P-03 – TDD-Testdatei vorhanden
        run: |
          bash scripts/process_guard/check_test_file_exists.sh "${{ github.head_ref }}"

      - name: P-04 – TDD Red-Phase bewiesen (Test-Commit vor Implementierung)
        run: |
          BRANCH="${{ github.head_ref }}"
          # TARA-0094: TARA-ID/Testdatei-Ableitung aus gemeinsamer Quelle
          # beziehen statt sie hier erneut zu duplizieren.
          if ! RESOLVED=$(bash scripts/process_guard/resolve_tara_testfile.sh "$BRANCH"); then
            echo "INFO P-04: Kein TARA-ID im Branch – P-04 uebersprungen"
            exit 0
          fi
          eval "$RESOLVED"
          BASE="${{ github.event.pull_request.base.sha }}"
          bash scripts/process_guard/check_red_phase.sh "$BASE" "$TESTFILE"

      - name: Python-Umgebung einrichten (fuer P-06)
        run: |
          pip install pytest pytest-timeout --quiet
          [ -f tests/requirements.txt ] && pip install -r tests/requirements.txt --quiet || true
          [ -f requirements.txt ] && pip install -r requirements.txt --quiet || true

      - name: P-06 – Story-Tests gruen
        run: |
          BRANCH="${{ github.head_ref }}"
          # TARA-0094: TARA-ID/Testdatei-Ableitung aus gemeinsamer Quelle
          # beziehen statt sie hier erneut zu duplizieren.
          if ! RESOLVED=$(bash scripts/process_guard/resolve_tara_testfile.sh "$BRANCH"); then
            echo "INFO P-06: Kein TARA-ID – P-06 uebersprungen"
            exit 0
          fi
          eval "$RESOLVED"
          if [ ! -f "$TESTFILE" ]; then
            echo "INFO P-06: Testdatei nicht gefunden – P-06 uebersprungen"
            exit 0
          fi
          pytest "$TESTFILE" --noconftest -q
          if [ $? -eq 0 ]; then
            echo "OK P-06: Story-Tests gruen"
          else
            echo "FAIL P-06: Story-Tests fehlgeschlagen"
            exit 1
          fi

      - name: Node.js einrichten (fuer P-12/P-13)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: P-12 – Prettier (nur bei JS/HTML-Aenderungen)
        run: |
          # Check if any JS or HTML files were changed in this PR
          BASE="${{ github.event.pull_request.base.sha }}"
          JS_CHANGES=$(git diff --name-only "$BASE..HEAD" | grep -cE '\.(js|html|css)$' || true)
          if [ "$JS_CHANGES" -eq 0 ]; then
            echo "INFO P-12: Keine JS/HTML-Aenderungen – Prettier-Check entfaellt (N/A fuer Python-Stories)"
            exit 0
          fi
          if [ ! -f "package.json" ]; then
            echo "INFO P-12: Kein package.json – P-12 uebersprungen"
            exit 0
          fi
          npm install --silent
          npm run format:check
          if [ $? -eq 0 ]; then
            echo "OK P-12: Prettier – alle Dateien korrekt formatiert"
          else
            echo "FAIL P-12: Prettier-Fehler gefunden. 'npm run format:write' ausfuehren und committen."
            exit 1
          fi

      - name: P-13 – ESLint (nur bei JS-Aenderungen)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          JS_CHANGES=$(git diff --name-only "$BASE..HEAD" | grep -cE '\.js$' || true)
          if [ "$JS_CHANGES" -eq 0 ]; then
            echo "INFO P-13: Keine JS-Aenderungen – ESLint-Check entfaellt (N/A fuer Python-Stories)"
            exit 0
          fi
          if [ ! -f "package.json" ]; then
            echo "INFO P-13: Kein package.json – P-13 uebersprungen"
            exit 0
          fi
          npm run lint
          if [ $? -eq 0 ]; then
            echo "OK P-13: ESLint – keine Fehler"
          else
            echo "FAIL P-13: ESLint-Fehler gefunden. Bitte beheben."
            exit 1
          fi

      - name: P-15 – Erinnerung (Done nur nach PO-OK)
        run: |
          echo "INFO P-15: Done darf NUR nach explizitem PO-OK gesetzt werden."
          echo "  Board-Automatisierung: po-approve.yml setzt Status automatisch nach PO-Kommentar."
