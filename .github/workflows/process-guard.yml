name: Process Guard – TDD & Compliance Check (P-02/P-03/P-04/P-06/P-07/P-08/P-09/P-12/P-13)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - development
      - main

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  process-guard:
    name: Prozess-Guard Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: P-07 – Branch-Name Schema
        run: |
          BRANCH="${{ github.head_ref }}"
          BASE="${{ github.base_ref }}"
          echo "Branch: $BRANCH -> $BASE"
          # Release-PRs: development -> main sind erlaubt (kein Feature-Branch noetig)
          if [ "$BRANCH" = "development" ] && [ "$BASE" = "main" ]; then
            echo "OK P-07: Release-PR development -> main ist erlaubt"
          elif echo "$BRANCH" | grep -qE '^(feature/TARA-[0-9]{4}-|hotfix/TARA-[0-9]{4}-|chore/)'; then
            echo "OK P-07: Branch-Name korrekt"
          else
            echo "FAIL P-07: Branch-Name '$BRANCH' entspricht nicht 'feature/TARA-XXXX-*'"
            exit 1
          fi

      - name: P-08 – TARA-ID in Commit-Messages
        run: |
          BRANCH="${{ github.head_ref }}"
          BASE_REF="${{ github.base_ref }}"
          # Release-PRs muessen nicht jeden Commit mit TARA-ID kennzeichnen
          if [ "$BRANCH" = "development" ] && [ "$BASE_REF" = "main" ]; then
            echo "OK P-08: Release-PR development -> main – Commit-Check uebersprungen"
            exit 0
          fi
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          MISSING=0
          while IFS= read -r line; do
            if ! echo "$line" | grep -qE 'TARA-[0-9]{4}|chore:|docs:|fix:|hotfix:'; then
              echo "FAIL P-08: Commit ohne TARA-ID: $line"
              MISSING=1
            fi
          done < <(git log --oneline "$BASE..$HEAD")
          if [ "$MISSING" -eq 0 ]; then
            echo "OK P-08: Alle Commits referenzieren TARA-ID"
          else
            exit 1
          fi

      - name: P-02/P-09 – Board-Status vor PR-Oeffnung
        id: board_status
        if: |
          !(github.head_ref == 'development' && github.base_ref == 'main')
        uses: actions/github-script@v7
        env:
          SK_PROJECT: "PVT_kwDOBu4dv84BfbaR"
          SK_FIELD: "PVTSSF_lADOBu4dv84BfbaRzhZuYME"
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const branch = context.payload.pull_request.head.ref;
            const match = branch.match(/TARA-(\d{4})/);
            if (!match) {
              console.log('INFO P-02/P-09: Kein TARA-ID im Branch – Check uebersprungen');
              return;
            }
            const taraId = `TARA-${match[1]}`;
            const projectId = process.env.SK_PROJECT;

            const query = `
              query($projectId: ID!) {
                node(id: $projectId) {
                  ... on ProjectV2 {
                    items(first: 100) {
                      nodes {
                        content { ... on Issue { title number } }
                        fieldValues(first: 10) {
                          nodes {
                            ... on ProjectV2ItemFieldSingleSelectValue {
                              name
                              field { ... on ProjectV2SingleSelectField { name } }
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }`;

            // TARA-0092: GraphQL-Aufruf robust gegen transiente Fehler kapseln.
            // Ein Netzwerk-/Rate-Limit-/Token-Fehler soll den gesamten
            // Compliance-Check nicht unkontrolliert crashen lassen – stattdessen
            // wird der P-02/P-09-Check bewusst uebersprungen (soft-skip) und als
            // Warnung sichtbar gemacht.
            let result;
            try {
              result = await github.graphql(query, { projectId });
            } catch (error) {
              core.warning(
                `P-02/P-09: Board-Status konnte nicht abgerufen werden (GraphQL-Fehler: ` +
                `${error.message || error}) – Check wird uebersprungen (soft-skip).`
              );
              return;
            }

            const items = result.node.items.nodes;
            // TARA-0091: Exaktes Matching der TARA-ID im Titel statt Substring-Vergleich,
            // damit z.B. "TARA-0083" nicht faelschlich auf "TARA-00831" matcht.
            const taraIdPattern = new RegExp(`\\b${taraId}\\b`);
            const match_item = items.find(
              item => item.content && item.content.title && taraIdPattern.test(item.content.title)
            );

            if (!match_item) {
              console.log(`INFO P-02/P-09: Kein Board-Item fuer ${taraId} gefunden – Check uebersprungen`);
              return;
            }

            const statusField = match_item.fieldValues.nodes.find(
              fv => fv.field && fv.field.name === 'Status'
            );

            // TARA-0090: Fehlt das Statusfeld (z.B. weil es umbenannt wurde oder
            // nicht mitgeliefert wird), darf der Check NICHT stillschweigend als
            // bestanden gelten (ein Platzhalter-Status waere sonst immer != "Todo" und damit immer "OK").
            if (!statusField) {
              core.setFailed(
                `FAIL P-02/P-09: Statusfeld fuer ${taraId} konnte nicht ermittelt werden ` +
                `(Feld "Status" fehlt in den Board-Daten). Der Check kann die Vorbedingung ` +
                `nicht verifizieren und schlaegt daher sicherheitshalber fehl.`
              );
              return;
            }

            const currentStatus = statusField.name;
            console.log(`${taraId}: aktueller Board-Status = ${currentStatus}`);

            // P-02: Status muss VOR Arbeitsbeginn auf "In Progress" gesetzt worden sein.
            // P-09: Status muss VOR PR-Oeffnung auf "inReview" gesetzt worden sein.
            // Naeherungsweise CI-Pruefung: sobald ein PR existiert (also Commits + Review
            // angefragt sind), darf der Status nicht mehr "Todo" sein.
            if (currentStatus === 'Todo') {
              core.setFailed(
                `FAIL P-02/P-09: Issue fuer ${taraId} steht noch auf Status "Todo", obwohl bereits ein PR ` +
                `existiert. Erwartet: mindestens "In Progress" (P-02) bzw. "inReview" (P-09) VOR PR-Oeffnung.`
              );
              return;
            }
            console.log(`OK P-02/P-09: Board-Status "${currentStatus}" ist plausibel fuer einen offenen PR`);

      - name: P-03 – TDD-Testdatei vorhanden
        run: |
          BRANCH="${{ github.head_ref }}"
          TARA_ID=$(echo "$BRANCH" | grep -oE 'TARA-[0-9]{4}' | head -1)
          if [ -z "$TARA_ID" ]; then
            echo "INFO P-03: Kein TARA-ID im Branch – P-03 uebersprungen"
            exit 0
          fi
          NUM=$(echo "$TARA_ID" | grep -oE '[0-9]{4}')
          TESTFILE="tests/test_TARA_${NUM}.py"
          if [ -f "$TESTFILE" ]; then
            echo "OK P-03: Testdatei $TESTFILE vorhanden"
          else
            echo "FAIL P-03: Testdatei $TESTFILE fehlt – TDD nicht eingehalten"
            exit 1
          fi

      - name: P-04 – TDD Red-Phase bewiesen (Test-Commit vor Implementierung)
        run: |
          BRANCH="${{ github.head_ref }}"
          TARA_ID=$(echo "$BRANCH" | grep -oE 'TARA-[0-9]{4}' | head -1)
          if [ -z "$TARA_ID" ]; then
            echo "INFO P-04: Kein TARA-ID im Branch – P-04 uebersprungen"
            exit 0
          fi
          NUM=$(echo "$TARA_ID" | grep -oE '[0-9]{4}')
          TESTFILE="tests/test_TARA_${NUM}.py"
          if [ ! -f "$TESTFILE" ]; then
            echo "INFO P-04: Testdatei nicht gefunden – P-04 uebersprungen"
            exit 0
          fi

          BASE="${{ github.event.pull_request.base.sha }}"

          # Find the FIRST commit on this branch that added the test file
          FIRST_TEST_COMMIT=$(git log --diff-filter=A --format="%H" "$BASE..HEAD" -- "$TESTFILE" | tail -1)

          if [ -z "$FIRST_TEST_COMMIT" ]; then
            # Test file not added on this branch -> exists from base, not a new story test
            echo "INFO P-04: Testdatei nicht auf diesem Branch hinzugefuegt – P-04 uebersprungen"
            exit 0
          fi

          echo "Pruefe Red-Phase am Commit: $FIRST_TEST_COMMIT"

          # Check if at FIRST_TEST_COMMIT the test file is the ONLY story-related change
          # (i.e., implementation files were added later)
          IMPL_IN_FIRST=$(git diff-tree --no-commit-id -r --name-only "$FIRST_TEST_COMMIT" \
            | grep -vE "^tests/|^\.github/|^docs/|^agents/|^scripts/|^README|^CONTRIBUTING|^CHANGELOG" \
            | wc -l)

          if [ "$IMPL_IN_FIRST" -gt 0 ]; then
            echo "FAIL P-04: Im Red-Commit sind bereits Implementierungsdateien enthalten."
            echo "  P-04 erfordert: Test-Commit (nur tests/) VOR Implementierungs-Commit."
            echo "  Gefundene Nicht-Test-Dateien im ersten Test-Commit:"
            git diff-tree --no-commit-id -r --name-only "$FIRST_TEST_COMMIT" \
              | grep -vE "^tests/|^\.github/|^docs/|^agents/|^scripts/|^README|^CONTRIBUTING|^CHANGELOG"
            exit 1
          fi

          # Now verify the test actually FAILED at that commit via git worktree
          git worktree add /tmp/red-phase "$FIRST_TEST_COMMIT" 2>/dev/null
          cd /tmp/red-phase
          pip install pytest pytest-timeout --quiet 2>/dev/null
          [ -f tests/requirements.txt ] && pip install -r tests/requirements.txt --quiet 2>/dev/null
          [ -f requirements.txt ] && pip install -r requirements.txt --quiet 2>/dev/null
          set +e
          pytest "$TESTFILE" --noconftest -q 2>&1
          RED_EXIT=$?
          set -e
          cd -
          git worktree remove /tmp/red-phase --force 2>/dev/null

          if [ "$RED_EXIT" -ne 0 ]; then
            echo "OK P-04: Red-Phase bestaetigt – Tests haben beim Red-Commit gefehlt"
          else
            echo "FAIL P-04: Tests waren GRUEN beim Red-Commit $FIRST_TEST_COMMIT"
            echo "  Tests muessen beim Red-Commit FEHLSCHLAGEN (Regel P-04)."
            echo "  Pruefe ob Implementierung im gleichen Commit wie Tests ist."
            exit 1
          fi

      - name: Python-Umgebung einrichten (fuer P-06)
        run: |
          pip install pytest pytest-timeout --quiet
          [ -f tests/requirements.txt ] && pip install -r tests/requirements.txt --quiet || true
          [ -f requirements.txt ] && pip install -r requirements.txt --quiet || true

      - name: P-06 – Story-Tests gruen
        run: |
          BRANCH="${{ github.head_ref }}"
          TARA_ID=$(echo "$BRANCH" | grep -oE 'TARA-[0-9]{4}' | head -1)
          if [ -z "$TARA_ID" ]; then
            echo "INFO P-06: Kein TARA-ID – P-06 uebersprungen"
            exit 0
          fi
          NUM=$(echo "$TARA_ID" | grep -oE '[0-9]{4}')
          TESTFILE="tests/test_TARA_${NUM}.py"
          if [ ! -f "$TESTFILE" ]; then
            echo "INFO P-06: Testdatei nicht gefunden – P-06 uebersprungen"
            exit 0
          fi
          pytest "$TESTFILE" --noconftest -q
          if [ $? -eq 0 ]; then
            echo "OK P-06: Story-Tests gruen"
          else
            echo "FAIL P-06: Story-Tests fehlgeschlagen"
            exit 1
          fi

      - name: Node.js einrichten (fuer P-12/P-13)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: P-12 – Prettier (nur bei JS/HTML-Aenderungen)
        run: |
          # Check if any JS or HTML files were changed in this PR
          BASE="${{ github.event.pull_request.base.sha }}"
          JS_CHANGES=$(git diff --name-only "$BASE..HEAD" | grep -cE '\.(js|html|css)$' || true)
          if [ "$JS_CHANGES" -eq 0 ]; then
            echo "INFO P-12: Keine JS/HTML-Aenderungen – Prettier-Check entfaellt (N/A fuer Python-Stories)"
            exit 0
          fi
          if [ ! -f "package.json" ]; then
            echo "INFO P-12: Kein package.json – P-12 uebersprungen"
            exit 0
          fi
          npm install --silent
          npm run format:check
          if [ $? -eq 0 ]; then
            echo "OK P-12: Prettier – alle Dateien korrekt formatiert"
          else
            echo "FAIL P-12: Prettier-Fehler gefunden. 'npm run format:write' ausfuehren und committen."
            exit 1
          fi

      - name: P-13 – ESLint (nur bei JS-Aenderungen)
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          JS_CHANGES=$(git diff --name-only "$BASE..HEAD" | grep -cE '\.js$' || true)
          if [ "$JS_CHANGES" -eq 0 ]; then
            echo "INFO P-13: Keine JS-Aenderungen – ESLint-Check entfaellt (N/A fuer Python-Stories)"
            exit 0
          fi
          if [ ! -f "package.json" ]; then
            echo "INFO P-13: Kein package.json – P-13 uebersprungen"
            exit 0
          fi
          npm run lint
          if [ $? -eq 0 ]; then
            echo "OK P-13: ESLint – keine Fehler"
          else
            echo "FAIL P-13: ESLint-Fehler gefunden. Bitte beheben."
            exit 1
          fi

      - name: P-15 – Erinnerung (Done nur nach PO-OK)
        run: |
          echo "INFO P-15: Done darf NUR nach explizitem PO-OK gesetzt werden."
          echo "  Board-Automatisierung: po-approve.yml setzt Status automatisch nach PO-Kommentar."
