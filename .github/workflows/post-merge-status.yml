name: Post-Merge Status Update (P-11)

# TARA-0108/TARA-0110: Automatisiert den bisher manuellen Schritt "nach Merge
# Status pruefen" (P-11). Der Dev-Agent kann diesen Schritt weder vergessen
# noch sich selbst faelschlich als regelkonform attestieren - die Pruefung
# erfolgt technisch, ausgeloest durch das Merge-Event selbst.
#
# TARA-0121 (P-26/P-27): Seit Einfuehrung des geschuetzten Status "PO
# Release" setzt dieser Workflow den Status NICHT MEHR automatisch auf
# "Done" (das war bis TARA-0121 der Fall, Statusmodell B) - das wuerde das
# neue P-27-Gate umgehen. Der Uebergang "Accepted" -> "PO Release" -> "Done"
# erfolgt jetzt ausschliesslich ueber den check-po-release-Job in
# po-approve.yml, ausgeloest durch ein gebundenes "PO Release TARA-XXXX"-
# Kommando des PO. Dieser Workflow bestaetigt nur, dass der Status beim
# Merge tatsaechlich "Accepted" war (Sicherheitsnetz gegen P-25-Umgehung).

on:
  pull_request:
    types: [closed]
    branches:
      - development
      - main

permissions:
  contents: write
  issues: read

jobs:
  set-freigabe-after-merge:
    name: Merge-Bestaetigung (Status bleibt Accepted, P-27)
    # Gilt nur fuer Merges nach `development` (Story-PRs) - Release-PRs
    # development -> main haben kein "Bezug: #NNN" auf ein Story-Issue.
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python-Umgebung einrichten
        run: pip install --quiet --upgrade pip

      - name: P-11/P-25 – Merge bestaetigt, Status bleibt "Accepted" bis "PO Release" (P-27)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PROJECT_ID: "PVT_kwDOBu4dv84BfbaR"
          STATUS_FIELD_ID: "PVTSSF_lADOBu4dv84BfbaRzhZuYME"
        run: |
          python3 scripts/process_guard/auto_set_freigabe_after_merge.py \
            "$PR_BODY" "$REPO" "$PROJECT_ID" "$STATUS_FIELD_ID"

  delete-branch-after-merge:
    name: P-16 – Feature-Branch nach Merge loeschen
    # TARA-0117 (P-16, PO-Entscheidung Issue #188 Frage 2): Branch-Loeschung
    # wird explizit an den Merge-Workflow gekoppelt (nicht nur der globalen
    # Repo-Einstellung "Automatically delete head branches" ueberlassen),
    # damit sie im Audit-Trail nachvollziehbar ist - fuer Merges nach
    # `development` UND `main` gleichermassen (eigener Job, damit dies auch
    # fuer Release-PRs development -> main greift, die im Job oben bewusst
    # uebersprungen werden).
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Branch loeschen (ausser development/main)
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$HEAD_REF" = "development" ] || [ "$HEAD_REF" = "main" ]; then
            echo "INFO P-16: '$HEAD_REF' ist ein geschuetzter Branch, wird nicht geloescht."
          else
            gh api -X DELETE "repos/$REPO/git/refs/heads/$HEAD_REF" \
              && echo "OK P-16: Branch '$HEAD_REF' geloescht." \
              || echo "WARN P-16: Branch '$HEAD_REF' konnte nicht geloescht werden (evtl. bereits weg)."
          fi

