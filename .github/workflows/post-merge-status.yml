name: Post-Merge Status Update (P-11)

# TARA-0108/TARA-0110: Automatisiert den bisher manuellen Schritt "nach Merge
# Status setzen" (P-11). Der Dev-Agent kann diesen Schritt weder vergessen
# noch sich selbst faelschlich als regelkonform attestieren - die
# Statusaenderung erfolgt technisch, ausgeloest durch das Merge-Event selbst.
#
# TARA-0110 (Statusmodell B): Seit Einfuehrung des PO-Akzeptanz-Gates (P-25)
# ist die PO-Akzeptanz bereits VOR dem Merge erfolgt (Status "Accepted",
# vormals "Freigabe"). Dieser Workflow setzt den Status nach dem Merge
# deshalb direkt auf "Done" (nicht mehr auf "Freigabe").

on:
  pull_request:
    types: [closed]
    branches:
      - development

permissions:
  contents: read
  issues: read

jobs:
  set-freigabe-after-merge:
    name: Board-Status nach Merge auf "Done" setzen
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python-Umgebung einrichten
        run: pip install --quiet --upgrade pip

      - name: P-11 – Status automatisch auf "Done" setzen (nur wenn zuvor "Accepted")
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PROJECT_ID: "PVT_kwDOBu4dv84BfbaR"
          STATUS_FIELD_ID: "PVTSSF_lADOBu4dv84BfbaRzhZuYME"
        run: |
          python3 scripts/process_guard/auto_set_freigabe_after_merge.py \
            "$PR_BODY" "$REPO" "$PROJECT_ID" "$STATUS_FIELD_ID"
