name: Post-Merge Status Update (P-11)

# TARA-0108: Automatisiert den bisher manuellen Schritt "nach Merge Status auf
# 'Freigabe' setzen" (P-11). Der Dev-Agent kann diesen Schritt weder vergessen
# noch sich selbst faelschlich als regelkonform attestieren - die
# Statusaenderung erfolgt technisch, ausgeloest durch das Merge-Event selbst.

on:
  pull_request:
    types: [closed]
    branches:
      - development

permissions:
  contents: read
  issues: read

jobs:
  set-freigabe-after-merge:
    name: Board-Status nach Merge auf "Freigabe" setzen
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python-Umgebung einrichten
        run: pip install --quiet --upgrade pip

      - name: P-11 â€“ Status automatisch auf "Freigabe" setzen
        env:
          GH_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          REPO: ${{ github.repository }}
          PROJECT_ID: "PVT_kwDOBu4dv84BfbaR"
          STATUS_FIELD_ID: "PVTSSF_lADOBu4dv84BfbaRzhZuYME"
        run: |
          python3 scripts/process_guard/auto_set_freigabe_after_merge.py \
            "$PR_BODY" "$REPO" "$PROJECT_ID" "$STATUS_FIELD_ID"
