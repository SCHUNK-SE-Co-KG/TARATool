name: Mirror Sync - Bheowulf → SCHUNK Project Boards

on:
  schedule:
    # Daily at 02:00 UTC (3:00 CET)
    - cron: '0 2 * * *'
  workflow_dispatch:  # Manual trigger
  issues:
    types: [opened, edited, deleted, closed, reopened]

permissions:
  contents: read
  issues: read

jobs:
  sync-project-boards:
    runs-on: ubuntu-latest
    name: Sync Project Board Items
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run board sync analysis
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/sync_project_boards.py --limit 100 > /tmp/sync_report.txt 2>&1 || true
          cat /tmp/sync_report.txt

      - name: Comment on sync report (if differences found)
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = fs.readFileSync('/tmp/sync_report.txt', 'utf-8');
            
            // Check if boards are out of sync
            if (report.includes('[!] BOARDS NOT IN SYNC')) {
              console.log('Boards are out of sync - manual sync needed');
              
              // Create issue if sync is needed (optional)
              // Uncomment below to auto-create issues
              /*
              github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: '[MIRROR-SYNC] Project boards out of sync',
                body: '### Sync Status\n\n' + report,
                labels: ['mirror-sync', 'automation']
              });
              */
            } else {
              console.log('Project boards are in sync');
            }

      - name: Summary
        if: always()
        run: |
          echo "=== MIRROR SYNC STATUS ===" >> $GITHUB_STEP_SUMMARY
          tail -20 /tmp/sync_report.txt >> $GITHUB_STEP_SUMMARY
