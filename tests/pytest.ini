[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick smoke tests for basic functionality
    core: Tests for core modules (globals, utils, analysis_core, init)
    config: Tests for assessment configuration loading and propagation
    assets: Tests for asset management
    damage_scenarios: Tests for damage scenarios and impact matrix
    risk_analysis: Tests for risk analysis and attack trees
    security_goals: Tests for security goals
    residual_risk: Tests for residual risk analysis
    report: Tests for PDF report generation
    tree_export: Tests for Baumdaten ZIP export
    security_fixes: Tests for security and data-integrity fixes
    e2e: Full end-to-end workflow tests
    TARA_0004: Tests for TARA-0004 branch strategy and workflow documentation
    TARA_0006: Tests for TARA-0006 removal of obsolete parse_trivy scripts
    TARA_0020: Tests for TARA-0020 Prettier installation and configuration
    TARA_0021: Tests for TARA-0021 ESLint local configuration
    TARA_0022: Tests for TARA-0022 Workflow Integration Prettier+ESLint
    TARA_0024: Tests for TARA-0024 Canvas Prototyp
    TARA_0034: Tests for TARA-0034 Freigabe-Status und P-15
    TARA_0035: Tests for TARA-0035 GitHub Board Dokumentation
    TARA_0036: Tests for TARA-0036 Dev Agent Onboarding
    TARA_0037: Tests for TARA-0037 Tests README aktualisieren
    TARA_0039: Tests fuer TARA-0039 Playwright-Runtime-Infrastruktur
    TARA_0040: Tests fuer TARA-0040 Konsolenfehler und Warnungen (R-13)
    TARA_0041: Tests fuer TARA-0041 Netzwerkuleberwachung (R-14)
    TARA_0042: Tests fuer TARA-0042 DOM-Zustand und Event-Listener (R-15)
    TARA_0043: Tests fuer TARA-0043 Storage-Analyse (R-16)
    TARA_0044: Tests fuer TARA-0044 Performance und Speicher (R-17)
    TARA_0045: Tests fuer TARA-0045 Accessibility (R-18)
    TARA_0046: Tests fuer TARA-0046 CSP und Promise Rejections (R-19)
    TARA_0047: Tests fuer TARA-0047 Service Worker und Cross-Origin (R-20)
    TARA_0048: Tests fuer TARA-0048 Browser-Berechtigungen (R-21)
    TARA_0049: Tests fuer TARA-0049 Konsolidierter Report
    TARA_0050: Tests fuer TARA-0050 DOM-XSS Sinks (R-22)
    TARA_0051: Tests fuer TARA-0051 HTML Injection (R-23/24)
    TARA_0052: Tests fuer TARA-0052 eval/Function (R-25)
    TARA_0053: Tests fuer TARA-0053 CORS-Header (R-26)
    TARA_0054: Tests fuer TARA-0054 Clickjacking und Tabnabbing (R-27/28)
    TARA_0055: Tests fuer TARA-0055 Storage Deep-Scan und XSSI (R-29/30)
    TARA_0061: Tests for TARA-0061 Code Duplication Detection (R-39)
    TARA_0062: Tests for TARA-0062 Finding Quality Framework
    TARA_0076: Tests for TARA-0076 CVE-Fix jsPDF 4.2.0 -> 4.2.1
    security: Tests for security-related checks (SRI, CSP, integrity)

addopts =
    -v
    --tb=short
    --timeout=60
    --timeout=60

timeout = 60

# Playwright-Artefakte (screenshot, tracing) werden nur aktiviert wenn
# pytest-playwright installiert ist – NICHT in addopts (wuerden CI ohne
# playwright-install brechen). Fuer lokale Playwright-Laeufe:
#   pytest --screenshot=only-on-failure --tracing=retain-on-failure --output=test-results
