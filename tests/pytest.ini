[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
markers =
    smoke: Quick smoke tests for basic functionality
    core: Tests for core modules (globals, utils, analysis_core, init)
    config: Tests for assessment configuration loading and propagation
    assets: Tests for asset management
    damage_scenarios: Tests for damage scenarios and impact matrix
    risk_analysis: Tests for risk analysis and attack trees
    security_goals: Tests for security goals
    residual_risk: Tests for residual risk analysis
    report: Tests for PDF report generation
    tree_export: Tests for Baumdaten ZIP export
    security_fixes: Tests for security and data-integrity fixes
    e2e: Full end-to-end workflow tests
    TARA_0004: Tests for TARA-0004 branch strategy and workflow documentation
    TARA_0006: Tests for TARA-0006 removal of obsolete parse_trivy scripts
    TARA_0020: Tests for TARA-0020 Prettier installation and configuration
    TARA_0021: Tests for TARA-0021 ESLint local configuration

addopts =
    -v
    --tb=short
    --timeout=30

timeout = 30
